<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" role="img" aria-labelledby="archTitle archDesc" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <title id="archTitle">Tripo3D UE Bridge — data flow</title>
  <desc id="archDesc">Tripo Studio pushes AI-generated FBX models and PBR textures over a local WebSocket (ws://127.0.0.1:60620) to the Tripo3DUEBridge editor module, which imports them through the UE Interchange pipeline into /Game/TripoModels as static meshes with PBR materials and textures.</desc>
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrBlueRev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="900" height="412" fill="#f8fafc"/>

  <text x="30" y="42" font-size="20" font-weight="bold" fill="#0f172a">Tripo3D UE Bridge — data flow</text>
  <text x="30" y="64" font-size="12.5" fill="#64748b">Unofficial UE 5.9 adaptation · editor-only module · all traffic stays on localhost</text>

  <!-- Tripo Studio -->
  <rect x="30" y="120" width="190" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="125" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Tripo Studio</text>
  <text x="125" y="184" text-anchor="middle" font-size="12" fill="#475569">AI-generated models</text>
  <text x="125" y="202" text-anchor="middle" font-size="12" fill="#475569">FBX + PBR textures</text>

  <!-- Editor module -->
  <rect x="360" y="120" width="200" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Tripo3DUEBridge</text>
  <text x="460" y="184" text-anchor="middle" font-size="12" fill="#475569">editor module</text>
  <text x="460" y="202" text-anchor="middle" font-size="12" fill="#475569">local WebSocket server</text>

  <!-- Content browser -->
  <rect x="700" y="120" width="170" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="785" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">/Game/TripoModels</text>
  <text x="785" y="184" text-anchor="middle" font-size="12" fill="#475569">StaticMesh + PBR</text>
  <text x="785" y="202" text-anchor="middle" font-size="12" fill="#475569">materials &amp; textures</text>

  <!-- WebSocket label -->
  <text x="290" y="104" text-anchor="middle" font-size="11.5" font-family="Consolas, 'Courier New', monospace" fill="#334155">WebSocket · ws://127.0.0.1:60620</text>

  <!-- Control frames (bidirectional) -->
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#1d4ed8">JSON control frames</text>
  <line x1="222" y1="150" x2="356" y2="150" stroke="#2563eb" stroke-width="2" marker-start="url(#arrBlueRev)" marker-end="url(#arrBlue)"/>

  <!-- Binary frames (one way) -->
  <text x="290" y="195" text-anchor="middle" font-size="12" fill="#b45309">binary frames</text>
  <line x1="222" y1="205" x2="356" y2="205" stroke="#d97706" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="290" y="224" text-anchor="middle" font-size="11" fill="#b45309">(FBX chunks · 5 MiB)</text>

  <!-- Interchange import -->
  <text x="630" y="168" text-anchor="middle" font-size="12" fill="#047857">Interchange import</text>
  <line x1="562" y1="180" x2="696" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- Legend -->
  <rect x="30" y="280" width="840" height="112" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="306" font-size="13" font-weight="bold" fill="#0f172a">Legend</text>
  <line x1="50" y1="330" x2="110" y2="330" stroke="#2563eb" stroke-width="2" marker-start="url(#arrBlueRev)" marker-end="url(#arrBlue)"/>
  <text x="122" y="334" font-size="12" fill="#334155">Control frames (JSON text): handshake / handshake_ack · ping / pong · file_transfer_ack · import_complete</text>
  <line x1="50" y1="356" x2="110" y2="356" stroke="#d97706" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="122" y="360" font-size="12" fill="#334155">Binary frames: JSON header + raw FBX bytes, sent in 5 MiB chunks (Tripo Studio → bridge)</text>
  <line x1="50" y1="382" x2="110" y2="382" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="122" y="386" font-size="12" fill="#334155">Interchange import runs inside the editor — no network involved</text>
</svg>
